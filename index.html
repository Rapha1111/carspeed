<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vitesse en direct</title>
<style>
    :root {
        color-scheme: dark;
        --bg-1: #05070d;
        --bg-2: #0d1b2a;
        --accent: #3ee6c4;
        --accent-2: #4f8cff;
        --text-dim: #7c8aa3;
        --danger: #ff5f6d;
    }

    * { box-sizing: border-box; }

    html, body {
        height: 100%;
    }

    body {
        margin: 0;
        font-family: "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at 50% 20%, var(--bg-2), var(--bg-1) 70%);
        color: #f2f5fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
    }

    .glow {
        position: fixed;
        width: 70vmax;
        height: 70vmax;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(62,230,196,0.14), transparent 65%);
        top: -20vmax;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        filter: blur(10px);
    }

    .app {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        width: min(92vw, 640px);
        text-align: center;
    }

    .status {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .status .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-dim);
        transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status.live .dot {
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
    }

    .status.error .dot {
        background: var(--danger);
        box-shadow: 0 0 10px var(--danger);
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
    }

    .speed-wrap {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 12px;
        line-height: 1;
    }

    #speed {
        font-size: clamp(4.5rem, 24vw, 13rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        background: linear-gradient(180deg, #ffffff 0%, #b9c6e0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transition: transform 0.15s ease-out;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 60px rgba(79, 140, 255, 0.25);
    }

    #speed.bump {
        transform: scale(1.03);
    }

    #unit {
        font-size: clamp(1.1rem, 3vw, 1.8rem);
        font-weight: 600;
        color: var(--text-dim);
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        transition: background 0.2s ease, color 0.2s ease;
    }

    #unit:hover, #unit:active {
        background: rgba(255,255,255,0.08);
        color: #fff;
    }

    .meta {
        display: flex;
        gap: 28px;
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-top: 6px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .meta b {
        color: #f2f5fa;
        font-weight: 700;
    }

    .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-1);
        z-index: 10;
        padding: 24px;
        text-align: center;
    }

    .overlay-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 420px;
    }

    .overlay h1 {
        font-size: 1.4rem;
        margin: 0;
    }

    .overlay p {
        margin: 0;
        color: var(--text-dim);
        line-height: 1.5;
    }

    button.action {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #04121a;
        font-weight: 700;
        font-size: 1rem;
        padding: 14px 28px;
        border-radius: 999px;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(62, 230, 196, 0.25);
    }

    button.action:active {
        transform: scale(0.97);
    }

    .icon {
        font-size: 2.6rem;
    }

    [hidden] { display: none !important; }
</style>
</head>
<body>
    <div class="glow"></div>

    <div id="overlay" class="overlay">
        <div class="overlay-card">
            <div class="icon">📍</div>
            <h1 id="overlay-title">Activer la géolocalisation</h1>
            <p id="overlay-text">Autorisez l'accès à votre position pour afficher votre vitesse en direct, calculée à partir du GPS de votre appareil.</p>
            <button id="overlay-btn" class="action">Activer</button>
        </div>
    </div>

    <div class="app">
        <div id="status" class="status"><span class="dot"></span><span id="status-text">En attente</span></div>

        <div class="speed-wrap">
            <div id="speed">0</div>
            <div id="unit">km/h</div>
        </div>

        <div class="meta">
            <div>Max&nbsp;<b id="max-speed">0</b></div>
            <div>Précision&nbsp;<b id="accuracy">–</b></div>
        </div>
    </div>

    <script>
        (function () {
            const speedEl = document.getElementById("speed");
            const unitEl = document.getElementById("unit");
            const statusEl = document.getElementById("status");
            const statusTextEl = document.getElementById("status-text");
            const maxSpeedEl = document.getElementById("max-speed");
            const accuracyEl = document.getElementById("accuracy");
            const overlay = document.getElementById("overlay");
            const overlayTitle = document.getElementById("overlay-title");
            const overlayText = document.getElementById("overlay-text");
            const overlayBtn = document.getElementById("overlay-btn");

            let unit = "kmh"; // "kmh" or "mph"
            let maxKmh = 0;
            let lastPosition = null;
            let watchId = null;

            function toDisplay(kmh) {
                return unit === "kmh" ? kmh : kmh * 0.621371;
            }

            function unitLabel() {
                return unit === "kmh" ? "km/h" : "mph";
            }

            function render(kmh) {
                if (kmh > maxKmh) maxKmh = kmh;
                speedEl.textContent = toDisplay(kmh).toFixed(0);
                unitEl.textContent = unitLabel();
                maxSpeedEl.textContent = toDisplay(maxKmh).toFixed(0) + " " + unitLabel();
                speedEl.classList.remove("bump");
                // force reflow to restart animation
                void speedEl.offsetWidth;
                speedEl.classList.add("bump");
            }

            unitEl.addEventListener("click", function () {
                unit = unit === "kmh" ? "mph" : "kmh";
                unitEl.textContent = unitLabel();
                maxSpeedEl.textContent = toDisplay(maxKmh).toFixed(0) + " " + unitLabel();
            });

            function setStatus(mode, text) {
                statusEl.className = "status" + (mode ? " " + mode : "");
                statusTextEl.textContent = text;
            }

            // Distance haversine en mètres, utilisée si le GPS ne fournit pas coords.speed
            function haversine(lat1, lon1, lat2, lon2) {
                const R = 6371000;
                const toRad = deg => deg * Math.PI / 180;
                const dLat = toRad(lat2 - lat1);
                const dLon = toRad(lon2 - lon1);
                const a = Math.sin(dLat / 2) ** 2 +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
                return 2 * R * Math.asin(Math.sqrt(a));
            }

            function handlePosition(position) {
                const coords = position.coords;
                let speedKmh;

                if (typeof coords.speed === "number" && coords.speed !== null && !Number.isNaN(coords.speed)) {
                    speedKmh = Math.max(0, coords.speed * 3.6);
                } else if (lastPosition) {
                    const dt = (position.timestamp - lastPosition.timestamp) / 1000;
                    if (dt > 0) {
                        const dist = haversine(
                            lastPosition.coords.latitude, lastPosition.coords.longitude,
                            coords.latitude, coords.longitude
                        );
                        speedKmh = Math.max(0, (dist / dt) * 3.6);
                    } else {
                        speedKmh = 0;
                    }
                } else {
                    speedKmh = 0;
                }

                lastPosition = position;
                setStatus("live", "En direct");
                accuracyEl.textContent = Math.round(coords.accuracy) + " m";
                render(speedKmh);
            }

            function handleError(error) {
                console.error("Erreur de géolocalisation:", error);
                if (error.code === error.PERMISSION_DENIED) {
                    setStatus("error", "Permission refusée");
                    overlayTitle.textContent = "Accès refusé";
                    overlayText.textContent = "Vous avez refusé l'accès à votre position. Autorisez la géolocalisation dans les réglages de votre navigateur puis réessayez.";
                    overlayBtn.textContent = "Réessayer";
                    overlay.hidden = false;
                } else {
                    setStatus("error", "Signal perdu");
                    accuracyEl.textContent = "–";
                }
            }

            function startWatching() {
                if (!("geolocation" in navigator)) {
                    overlayTitle.textContent = "Non disponible";
                    overlayText.textContent = "Votre navigateur ne prend pas en charge la géolocalisation.";
                    overlayBtn.hidden = true;
                    overlay.hidden = false;
                    return;
                }

                overlay.hidden = true;
                setStatus("", "Recherche du signal…");

                if (watchId !== null) navigator.geolocation.clearWatch(watchId);

                watchId = navigator.geolocation.watchPosition(handlePosition, handleError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
            }

            overlayBtn.addEventListener("click", startWatching);

            if ("permissions" in navigator) {
                navigator.permissions.query({ name: "geolocation" }).then(function (status) {
                    if (status.state === "granted") {
                        startWatching();
                    } else if (status.state === "prompt") {
                        overlay.hidden = false;
                    } else {
                        overlayTitle.textContent = "Accès refusé";
                        overlayText.textContent = "Autorisez la géolocalisation dans les réglages de votre navigateur puis réessayez.";
                        overlayBtn.textContent = "Réessayer";
                        overlay.hidden = false;
                    }
                    status.onchange = function () {
                        if (status.state === "granted") startWatching();
                    };
                }).catch(startWatching);
            } else {
                overlay.hidden = false;
            }
        })();
    </script>
</body>
</html>
